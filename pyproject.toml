[project]
name = "playmemories-duplicate-lab"
version = "0.2.1"
description = "Laboratorio local e somente leitura para investigar fotografias duplicadas"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "imagehash>=4.3.2",
  "numpy>=2.0",
  "pillow>=11.0",
  "scikit-image>=0.25",
]

[project.scripts]
duplicate-lab = "duplicate_lab.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duplicate_lab"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
